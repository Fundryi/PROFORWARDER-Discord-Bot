name: Build & Push Docker Images

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # Monday 03:17 UTC, rebuild for base-image updates
  workflow_dispatch:

env:
  # Lowercase on purpose: compose.yaml pulls these exact names.
  IMAGE_BASE: ghcr.io/fundryi/proforwarder-discord-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bot
            context: .
          - name: cloudflared
            context: ./docker/cloudflared

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_BASE }}/${{ matrix.name }}:sha-${{ steps.meta.outputs.sha_short }}
